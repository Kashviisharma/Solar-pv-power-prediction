version: '3.8'

services:
  # FastAPI application
  api:
    build: .
    container_name: solar-pv-api
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./api:/app/api
      - ./models:/app/models
      - ./data/processed:/app/data/processed
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Streamlit frontend
  streamlit:
    build: .
    container_name: solar-pv-streamlit
    command: ["streamlit", "run", "frontend/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src
      - ./frontend:/app/frontend
      - ./models:/app/models
      - ./data/processed:/app/data/processed
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    depends_on:
      - api

  # Grafana for visualization
  grafana:
    image: grafana/grafana:10.0.0
    container_name: solar-pv-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/solar-pv-dashboard.json
      - grafana-storage:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    restart: unless-stopped
    depends_on:
      - api

  # Optional: PostgreSQL for time-series data storage
  # Uncomment to use PostgreSQL instead of CSV storage
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: solar-pv-postgres
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #     - ./data/processed:/data
  #   environment:
  #     - POSTGRES_DB=solar_pv
  #     - POSTGRES_USER=solar_user
  #     - POSTGRES_PASSWORD=solar_pass
  #   restart: unless-stopped

volumes:
  grafana-storage:
  # postgres-data:

networks:
  default:
    name: solar-pv-network
